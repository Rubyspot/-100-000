<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>$100,000 musical experience</title>
<style>
  /* The start card in the jetski race's style (jetski/index.html), over Ilia's
     picture of the room with Jane (assets/start.jpg). */
  @font-face { font-family: Fredoka; font-weight: 600; src: url(./jetski/assets/fonts/fredoka-latin-600-normal.woff2) format("woff2"); font-display: swap; }
  @font-face { font-family: Fredoka; font-weight: 700; src: url(./jetski/assets/fonts/fredoka-latin-700-normal.woff2) format("woff2"); font-display: swap; }
  :root {
    --plum: #2a1030;
    --pink: #ff4fa3;
    --yellow: #ffd23f;
    --cream: #fff6e0;
    --muted: #e7c9dc;
  }
  html, body { height: 100%; margin: 0; background: #241016; color: var(--cream);
    font: 600 16px/1.45 Fredoka, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; position: fixed; inset: 0; }
  /* The picture fills the screen behind the card. Jane surfs just right of
     its middle, and the card stands on her left (Ilia, Nov 18: "button on the
     left side from Jane"); on a tall screen it goes above her head. */
  #ui { position: fixed; inset: 0; display: flex; align-items: center; padding: 16px max(16px, 6vw);
    box-sizing: border-box; overflow-y: auto;
    background: #241016 url(./assets/start.jpg) center / cover no-repeat; }
  #ui[hidden] { display: none; }
  .card { background: rgba(42, 16, 48, .88); border: 5px solid var(--pink); border-radius: 28px;
    box-shadow: 0 0 0 3px var(--plum), 8px 10px 0 var(--yellow);
    padding: 26px 28px 24px; max-width: min(24rem, 38vw); width: 100%; box-sizing: border-box; }
  h1 { margin: 0 0 22px; font-size: 3rem; line-height: 1; color: var(--yellow);
    text-shadow: 3px 3px 0 var(--pink); letter-spacing: .01em; }
  h1 span { display: block; margin-top: 8px; font-size: 1.45rem; line-height: 1.15; color: var(--cream);
    text-shadow: 2px 2px 0 var(--plum); letter-spacing: .02em; }
  button { font: inherit; font-weight: 700; border: 3px solid var(--plum); border-radius: 999px; padding: 14px 22px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #enterXr { background: var(--yellow); color: var(--plum); width: 100%; font-size: 1.25rem; }
  button:focus-visible { outline: 3px solid var(--cream); outline-offset: 2px; }
  .status { font-variant-numeric: tabular-nums; color: var(--muted); margin: 14px 0 0; font-size: .92rem; }
  .status:empty { display: none; }
  #replay { position: fixed; right: 16px; bottom: 16px; background: var(--yellow); color: var(--plum); }
  @media (max-aspect-ratio: 4/5) {
    #ui { align-items: flex-start; justify-content: center; padding: 16px; }
    .card { max-width: 24rem; padding: 18px 20px; }
    h1 { font-size: 2.3rem; margin-bottom: 16px; }
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/",
    "@sparkjsdev/spark": "./vendor/spark.module.min.js"
} }
</script>
</head>
<body>
<div id="ui">
  <div class="card">
    <h1>$100,000<span>musical experience</span></h1>
    <button id="enterXr" disabled>Enter VR</button>
    <p class="status" id="status">Loading…</p>
  </div>
</div>
<button id="replay" hidden>Replay</button>
<script>
  // Show any startup error on the card instead of hanging on "Loading…".
  function showError(msg) {
    var el = document.getElementById('status');
    if (el) { el.textContent = 'Error: ' + msg; el.style.color = '#ffd23f'; }
  }
  addEventListener('error', function (e) { if (e.message || e.error) showError(e.message || e.error.message); });
  addEventListener('unhandledrejection', function (e) { showError((e.reason && e.reason.message) || String(e.reason)); });
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
