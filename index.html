<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>$100,000 · Opening prototype</title>
<style>
  :root {
    --bg: #0d1412;
    --panel: #15211d;
    --fg: #eef3ea;
    --muted: #9fb2a6;
    --money: #8fd18a;
    --gold: #f2c45a;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; position: fixed; inset: 0; }
  #ui { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; }
  #ui[hidden] { display: none; }
  .card { background: var(--panel); border: 1px solid #2a3a33; border-radius: 14px;
    padding: 28px; max-width: 30rem; width: 100%; box-sizing: border-box; }
  h1 { margin: 0 0 4px; font-size: 2rem; letter-spacing: -0.01em; color: var(--money); }
  .sub { margin: 0 0 20px; color: var(--muted); }
  .status { font-variant-numeric: tabular-nums; color: var(--muted); margin: 0 0 18px; min-height: 1.4em; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 14px 20px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #enterXr { background: var(--gold); color: #1d1606; flex: 1 1 14rem; }
  #preview { background: transparent; color: var(--fg); border: 1px solid #3a4c44; }
  button:focus-visible { outline: 3px solid var(--money); outline-offset: 2px; }
  .note { margin: 18px 0 0; font-size: .85rem; color: var(--muted); }
  #replay { position: fixed; right: 16px; bottom: 16px; background: var(--gold); color: #1d1606; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/",
    "@sparkjsdev/spark": "./vendor/spark.module.min.js"
} }
</script>
</head>
<body>
<div id="ui">
  <div class="card">
    <h1>$100,000</h1>
    <p class="sub">Opening scene draft: the bill, the seagull and the portal.</p>
    <p class="status" id="status">Loading…</p>
    <div class="row">
      <button id="enterXr" disabled>Enter mixed reality</button>
      <button id="preview" disabled>Preview on this screen</button>
    </div>
    <p class="note">Stand or sit with about 1.5 m of clear space in front of you. After the portal passes over you, pinch to replay.</p>
  </div>
</div>
<button id="replay" hidden>Replay</button>
<script type="module" src="./main.js"></script>
</body>
</html>
